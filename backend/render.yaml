services:
  - type: web
    name: photo-course-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: SWAGGER_LOGIN
        sync: false
      - key: SWAGGER_PASS
        sync: false
